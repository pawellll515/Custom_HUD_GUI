name: Build Custom HUD GUI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Minecraft ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: "1.21.4"
            project: "Custom_HUD_GUI_Fabric_FIXED/custom-hud-gui/mc1.21.4"
          - minecraft: "1.21.11"
            project: "Custom_HUD_GUI_Fabric_FIXED/custom-hud-gui/mc1.21.11"


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        working-directory: ${{ matrix.project }}
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew build
          else
            gradle build
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Custom-HUD-GUI-Minecraft-${{ matrix.minecraft }}
          path: ${{ matrix.project }}/build/libs/*.jar
          if-no-files-found: error
